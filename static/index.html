<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shorts Maker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #7c5cff;
    --accent2: #ff5c8a;
    --text: #f2f2f5;
    --muted: #9096a5;
    --border: #2a2e38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% -10%, #221a3a 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 16px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 2rem;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 28px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="file"], input[type="number"] {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #10121a;
    color: var(--text);
    font-size: 0.95rem;
  }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  button.submit {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: white;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 6px;
  }
  button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .hidden { display: none !important; }
  #status { color: var(--muted); font-size: 0.9rem; margin-top: 14px; text-align: center; }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 8px; }
  .clip-card {
    background: #10121a;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .clip-card video { width: 100%; display: block; aspect-ratio: 9/16; background: black; }
  .clip-meta { padding: 10px 12px; font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .clip-meta a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .error { color: var(--accent2); font-size: 0.9rem; margin-top: 10px; }
  footer {
    margin-top: 36px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
  }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
    display: inline-block; vertical-align: middle; margin-right: 8px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Shorts Maker</h1>
  <p class="sub">Paste a YouTube link or upload a video — get vertical shorts from the most energetic moments.</p>

  <div class="panel">
    <div class="tabs">
      <button class="tab-btn active" data-tab="youtube">YouTube link</button>
      <button class="tab-btn" data-tab="upload">Upload file</button>
    </div>

    <form id="form">
      <div id="tab-youtube" class="field">
        <label for="youtube_url">YouTube URL</label>
        <input type="text" id="youtube_url" name="youtube_url" placeholder="https://www.youtube.com/watch?v=..." />
      </div>

      <div id="tab-upload" class="field hidden">
        <label for="file">Video file</label>
        <input type="file" id="file" name="file" accept="video/*" />
      </div>

      <div class="row">
        <div class="field">
          <label for="clip_length">Clip length (seconds)</label>
          <input type="number" id="clip_length" name="clip_length" value="30" min="5" max="120" />
        </div>
        <div class="field">
          <label for="num_clips">Number of shorts</label>
          <input type="number" id="num_clips" name="num_clips" value="3" min="1" max="10" />
        </div>
      </div>

      <button type="submit" class="submit" id="submitBtn">Generate shorts</button>
    </form>

    <div id="status"></div>
    <div id="error" class="error"></div>
  </div>

  <div id="results" class="clips"></div>

  <footer>© 2026 Kamran Lambate. All rights reserved.</footer>
</div>

<script>
const tabs = document.querySelectorAll(".tab-btn");
const tabYoutube = document.getElementById("tab-youtube");
const tabUpload = document.getElementById("tab-upload");
let activeTab = "youtube";

tabs.forEach(btn => {
  btn.addEventListener("click", () => {
    tabs.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeTab = btn.dataset.tab;
    tabYoutube.classList.toggle("hidden", activeTab !== "youtube");
    tabUpload.classList.toggle("hidden", activeTab !== "upload");
  });
});

const form = document.getElementById("form");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const resultsEl = document.getElementById("results");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.textContent = "";
  resultsEl.innerHTML = "";
  submitBtn.disabled = true;
  statusEl.innerHTML = '<span class="spinner"></span>Downloading & analyzing audio for exciting moments…';

  const formData = new FormData();
  formData.append("clip_length", document.getElementById("clip_length").value);
  formData.append("num_clips", document.getElementById("num_clips").value);

  if (activeTab === "youtube") {
    formData.append("youtube_url", document.getElementById("youtube_url").value);
  } else {
    const fileInput = document.getElementById("file");
    if (fileInput.files[0]) formData.append("file", fileInput.files[0]);
  }

  try {
    const res = await fetch("/process", { method: "POST", body: formData });
    const data = await res.json();

    if (data.error) {
      errorEl.textContent = data.error;
      statusEl.textContent = "";
    } else {
      statusEl.textContent = `Done — generated ${data.clips.length} short(s).`;
      data.clips.forEach((clip, i) => {
        const card = document.createElement("div");
        card.className = "clip-card";
        card.innerHTML = `
          <video src="${clip.url}" controls></video>
          <div class="clip-meta">
            <span>Short ${i + 1} · from ${clip.start}s</span>
            <a href="${clip.url}" download>Download</a>
          </div>`;
        resultsEl.appendChild(card);
      });
    }
  } catch (err) {
    errorEl.textContent = "Something went wrong: " + err.message;
    statusEl.textContent = "";
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
